name: Apply Room Data Runtime Seam

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-runtime-seam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify patch applies
        run: node tools/check-room-data-runtime-seam-patch-apply.js

      - name: Apply runtime seam patch
        run: git apply patches/room-data-runtime-seam.patch

      - name: Verify patched runtime syntax
        run: node --check summit-spark.js

      - name: Verify room data guards
        run: |
          node tools/check-room-data-runtime-compat-seam.js
          node tools/check-room-data-seam-preflight.js
          node tools/check-room-data-p2-status.js
          npm run check

      - name: Create runtime seam pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: room-data-runtime-seam-apply-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add summit-spark.js
          git commit -m "runtime: insert room data compatibility seam"
          git push origin "$BRANCH_NAME"
          cat > pr-body.md <<'PR_BODY'
          ## Summary

          Applies the checked room-data runtime seam patch generated by `patches/room-data-runtime-seam.patch`.

          This inserts `createRoomDataRuntimeViewFromEmbeddedConstants()` near the embedded room-data constants in `summit-spark.js`.

          ## Runtime impact

          - No gameplay reads are replaced.
          - No room-data source switch is performed.
          - Runtime still reads embedded `summit-spark.js` constants.
          - No physics constants, save schema, HTML/CSS, module system, bundler, or async loading behavior is changed.

          ## Checks run by workflow

          - `node tools/check-room-data-runtime-seam-patch-apply.js`
          - `node --check summit-spark.js`
          - `node tools/check-room-data-runtime-compat-seam.js`
          - `node tools/check-room-data-seam-preflight.js`
          - `node tools/check-room-data-p2-status.js`
          - `npm run check`

          Refs #2.
          PR_BODY
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "runtime: insert room data compatibility seam" \
            --body-file pr-body.md || {
              echo "::warning::Created branch $BRANCH_NAME, but this organization does not allow GitHub Actions to create pull requests."
              echo "Open the pull request manually from branch $BRANCH_NAME."
            }
