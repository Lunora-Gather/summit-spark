name: Maintenance Tools

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check room data migration
        run: node tools/check-room-data-migration.js

      - name: Check room data adapter plan
        run: node tools/check-room-data-adapter-plan.js

      - name: Check room data runtime view
        run: node tools/check-room-data-runtime-view.js

      - name: Check room data legacy constants
        run: node tools/check-room-data-legacy-constants.js

      - name: Check room data source switch readiness
        run: node tools/check-room-data-source-switch-readiness.js

      - name: Check room data source switch playtest template
        run: node tools/check-room-data-source-switch-playtest-template.js

      - name: Check room data runtime call-site plan
        run: node tools/check-room-data-runtime-callsite-plan.js

      - name: Check room data runtime compat seam
        run: node tools/check-room-data-runtime-compat-seam.js

      - name: Check room data P2 status
        run: node tools/check-room-data-p2-status.js

      - name: Check room data tool registry
        run: node tools/check-room-data-tool-registry.js

      - name: Check maintenance tools
        run: node tools/check-maintenance-tools.js
