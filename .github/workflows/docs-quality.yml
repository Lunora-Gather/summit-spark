name: Repository Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Parse GitHub YAML configuration
        run: ruby -r yaml -e 'Dir[".github/**/*.{yml,yaml}"].each { |file| Psych.parse_file(file) }'

      - name: Check documentation surface
        run: node tools/check-docs.js

      - name: Check public surface
        run: node tools/check-public-surface.js

      - name: Check data contracts
        run: node tools/check-data-contracts.js

      - name: Verify room data export
        run: node tools/export-room-data.js --check

      - name: Run default quality gate
        run: npm run check

  safari:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      - run: npm run test:safari
      - name: Preserve the practice map on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: safari-practice-map
          path: ${{ runner.temp }}/practice-map.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Select standard motion and full keyboard tab navigation
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write -g AppleKeyboardUIMode -int 3
          defaults write com.apple.Safari WebKitTabToLinksPreferenceKey -bool true
      - name: Verify desktop and account regressions in native Safari
        run: npm run browser-smoke

  safari-reduced-motion:
    name: Safari system reduced motion
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci
      - run: sudo safaridriver --enable
      - run: defaults write com.apple.universalaccess reduceMotion -bool true
      - run: node tools/check-browser-smoke.js --native-safari-reduced-motion

  safari-ios:
    name: Native iOS Safari safe areas
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci
      - run: sudo safaridriver --enable
      - name: Install simulator touch input
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/axe.tar.gz"
          curl --fail --location --retry 3 -o "$archive" https://github.com/cameroncooke/AXe/releases/download/v2.1.1/AXe-macOS-homebrew-v2.1.1.tar.gz
          echo "e8a4d873fe49e38d70b8fe1bea180658b5b997f5501561755e304641b1395256  $archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/axe"
          tar -xzf "$archive" -C "$RUNNER_TEMP/axe"
          echo "$RUNNER_TEMP/axe" >> "$GITHUB_PATH"
      - name: Boot a notched iPhone simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | jq -er '[.devices | to_entries | sort_by(.key) | reverse | .[].value[] | select((.name | startswith("iPhone")) and (.name | contains("SE") | not))][0].udid')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SAFARI_IOS_UDID=$udid" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          defaults write com.apple.iphonesimulator DevicePreferences -dict-add "$udid" '<dict><key>ConnectHardwareKeyboard</key><false/></dict>'
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          xcrun simctl launch "$udid" com.apple.mobilesafari
      - run: node tools/check-browser-smoke.js --native-safari-ios
      - name: Preserve the iPhone screen on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ios-keyboard
          path: ${{ runner.temp }}/ios-keyboard.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Report simulator state if Safari fails
        if: failure()
        run: |
          xcodebuild -version
          xcrun simctl list devices booted
          if [[ -n "${SAFARI_IOS_UDID:-}" ]]; then
            xcrun simctl spawn "$SAFARI_IOS_UDID" launchctl list | awk '/com.apple.mobilesafari|webinspectord/'
          fi
