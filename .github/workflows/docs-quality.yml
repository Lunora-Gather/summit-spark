name: Repository Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Parse GitHub YAML configuration
        run: ruby -r yaml -e 'Dir[".github/**/*.{yml,yaml}"].each { |file| Psych.parse_file(file) }'

      - name: Check documentation surface
        run: node tools/check-docs.js

      - name: Check public surface
        run: node tools/check-public-surface.js

      - name: Check data contracts
        run: node tools/check-data-contracts.js

      - name: Verify room data export
        run: node tools/export-room-data.js --check

      - name: Run default quality gate
        run: npm run check

      - name: Run real-browser gate
        run: npm run browser-smoke
        timeout-minutes: 5

  safari:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      - run: npm run test:safari
      - name: Select standard motion and full keyboard tab navigation
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write -g AppleKeyboardUIMode -int 3
          defaults write com.apple.Safari WebKitTabToLinksPreferenceKey -bool true
      - name: Verify desktop and account regressions in native Safari
        run: node tools/check-browser-smoke.js --native-safari

  safari-reduced-motion:
    name: Safari system reduced motion
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci
      - run: sudo safaridriver --enable
      - run: defaults write com.apple.universalaccess reduceMotion -bool true
      - run: node tools/check-browser-smoke.js --native-safari-reduced-motion

  safari-ios:
    name: Native iOS Safari safe areas
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci
      - run: sudo safaridriver --enable
      - name: Boot a notched iPhone simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | jq -er '[.devices | to_entries | sort_by(.key) | reverse | .[].value[] | select((.name | startswith("iPhone")) and (.name | contains("SE") | not))][0].udid')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SAFARI_IOS_UDID=$udid" >> "$GITHUB_ENV"
      - run: node tools/check-browser-smoke.js --native-safari-ios
