name: Repository Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Check documentation surface
        run: node tools/check-docs.js

      - name: Check public surface
        run: node tools/check-public-surface.js

      - name: Check data contracts
        run: node tools/check-data-contracts.js

      - name: Verify room data export
        run: node tools/export-room-data.js --check

      - name: Run default quality gate
        run: npm run check

      - name: Run real-browser gate
        run: npm run browser-smoke
        timeout-minutes: 5
